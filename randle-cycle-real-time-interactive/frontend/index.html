<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Randle Cycle Animation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
</head>

<body>
<div id="controls" style="position:absolute; top:10px; left:10px; color:white;">
    <label>Glucose input</label><br>
    <input id="gluSlider" type="range" min="0" max="3" step="0.1" value="0"><br><br>

    <label>Fatty acid input</label><br>
    <input id="fatSlider" type="range" min="0" max="3" step="0.1" value="0"><br><br>

    <label>ATP draw</label><br>
    <input id="atpSlider" type="range" min="0" max="1" step="0.05" value="0"><br><br>
</div>

  <script src="app.js"></script>
</body>
</html>
